services:
  web:
    build: .
    container_name: tenis_rezerwacje
    restart: unless-stopped
    volumes:
      - .:/app
    ports:
      - "8083:8000"
    environment:
      - FLASK_APP=run.py
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Warsaw
      - WHATSAPP_API_URL=http://waha:3000
      - WHATSAPP_SESSION=default
      - WHATSAPP_API_KEY=${WAHA_API_KEY}
    expose:
      - "8000"
    env_file:
      - .env
    command:
      [
        "gunicorn",
        "--bind",
        "0.0.0.0:8000",
        "--workers",
        "2",
        "--threads",
        "2",
        "run:app",
      ]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tenis-rezerwacje.rule=Host(`treningi.widzimyinaczej.org.pl`)"
      - "traefik.http.routers.tenis-rezerwacje.entrypoints=https"
      - "traefik.http.routers.tenis-rezerwacje.tls=true"
      - "traefik.http.services.tenis-rezerwacje.loadbalancer.server.port=8000"
    networks:
      - default
      - proxy
    depends_on:
      - waha

  # Portable scheduled jobs (reminders, coach summary, WAHA health, monthly).
  # No host crontab required — deploy this compose anywhere identically.
  scheduler:
    build: .
    container_name: tenis_scheduler
    restart: unless-stopped
    init: true
    volumes:
      - .:/app
    environment:
      - FLASK_APP=run.py
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Warsaw
      - WHATSAPP_API_URL=http://waha:3000
      - WAHA_URL=http://waha:3000
      - WHATSAPP_SESSION=default
      - WHATSAPP_API_KEY=${WAHA_API_KEY}
      - WAHA_API_KEY=${WAHA_API_KEY}
      - COORDINATOR_EMAIL=${COORDINATOR_EMAIL:-treningi@widzimyinaczej.org.pl}
    env_file:
      - .env
    command: ["supercronic", "-passthrough-logs", "/app/scripts/crontab"]
    networks:
      - default
    depends_on:
      - web
      - waha

  waha:
    image: devlikeapro/waha
    container_name: tenis_waha
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      - WHATSAPP_DEFAULT_ENGINE=WEBJS
      - WAHA_PRINT_QR=true
      - WHATSAPP_RESTART_ALL_SESSIONS=true
      - WHATSAPP_START_SESSION=default
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD}
      - WHATSAPP_HOOK_URL=http://web:8000/webhook/whatsapp
      - WHATSAPP_HOOK_EVENTS=message
    volumes:
      - waha_sessions:/app/.sessions
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 5 -H \"X-Api-Key: $WAHA_API_KEY\" http://localhost:3000/api/sessions/default"]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tenis-waha.rule=Host(`waha.widzimyinaczej.org.pl`)"
      - "traefik.http.routers.tenis-waha.entrypoints=https"
      - "traefik.http.routers.tenis-waha.tls=true"
      - "traefik.http.services.tenis-waha.loadbalancer.server.port=3000"
    networks:
      - default
      - proxy

volumes:
  waha_sessions:

networks:
  proxy:
    external: true
